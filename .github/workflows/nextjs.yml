name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Pull requests only verify the build. They deliberately avoid the
  # github-pages environment, which would record a deployment and can be
  # rejected outright by the environment's branch protection rules.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build site
        id: site
        uses: ./.github/actions/build-site

      - name: Upload CV preview
        if: steps.site.outputs.cv-available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cv-preview
          path: public/cv.pdf
          if-no-files-found: error
          retention-days: 7

  # Build and deploy share a runner: a separate deploy job spent more time
  # waiting for a runner than deploying.
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Build site
        uses: ./.github/actions/build-site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
